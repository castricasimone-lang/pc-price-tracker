name: Monitor Prezzi PC 24-7

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie Scraping e HTTP
        run: pip install requests beautifulsoup4

      - name: Esegui Bot Ricerca Prezzi e Invia Email
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python bot_scraper.py

      - name: Salva prezzi aggiornati nella Web App
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add prezzi.json
          git commit -m "Aggiornamento automatico prezzi PC" || exit 0
          git push
