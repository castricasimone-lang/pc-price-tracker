name: Monitor Prezzi PC 24-7

on:
  schedule:
    # Esegue il bot automaticamente ogni 6 ore (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Permette anche di avviarlo manualmente con un clic quando vuoi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie AI
        run: pip install google-genai

      - name: Esegui Bot Ricerca Prezzi e Invia Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python bot_scraper.py

      - name: Salva prezzi aggiornati nella Web App
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add prezzi.json
          git commit -m "Aggiornamento automatico prezzi PC" || exit 0
          git push
